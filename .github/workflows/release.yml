name: Release

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  # A tag can point at a commit that never went green, so check it again here
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    # The tag is pushed already, so rake release pushes nothing to the repository
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check that the tag matches the version
        run: |
          version=$(ruby -r ./lib/deflake/version -e 'print Deflake::VERSION')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Deflake::VERSION $version"
            exit 1
          fi
      - uses: rubygems/release-gem@v1
