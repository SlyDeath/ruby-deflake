name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Minitest ${{ matrix.minitest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        minitest: ["5", "6"]
    env:
      MINITEST_VERSION: "~> ${{ matrix.minitest }}.0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
        env:
          COVERAGE: "1"
      # One report is enough; without the token (as in a fork) the upload fails without failing CI
      - uses: codecov/codecov-action@v5
        if: matrix.ruby == '4.0' && matrix.minitest == '6'
        with:
          files: coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop
